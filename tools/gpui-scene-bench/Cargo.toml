[package]
name = "gpui-scene-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
echo_gpui = { path = "../..", features = ["gpui-bench"] }
gpui = { workspace = true, features = ["bench"] }
gpui_platform = { workspace = true, features = ["bench-support", "test-support"] }
smallvec.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "gpui_chat_scene_bench"
harness = false

[package.metadata.cargo-machete]
ignored = ["gpui_platform"]
