name: Linux test and build

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: "268435456"
  # A hosted runner compiles the test profile from cold, which outlasts the
  # harness default of 900 seconds per test stage.
  ECHO_LINUX_TEST_TIMEOUT_SECONDS: "2700"

jobs:
  verify:
    name: Test, smoke, and verify Linux x64
    # The apt package names below are release-specific; move them together with
    # this image.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Echo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The test, lint and distribution profiles together need more disk than
      # a hosted runner has free, so drop preinstalled SDKs Echo never uses.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      # Keep this list in step with scripts/check-linux-build-deps.sh, which
      # names the pkg-config modules and commands the build needs.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            build-essential \
            file \
            libasound2-dev \
            libfontconfig1-dev \
            libssl-dev \
            libvulkan-dev \
            libwayland-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers \
            xauth \
            xvfb \
            pkg-config

      # rust-toolchain.toml is the only toolchain pin; with no argument rustup
      # installs the toolchain and components that file names.
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # .config/nextest.toml's nextest-version is the only nextest pin. The
      # install action verifies the download against its own manifest, so a
      # nextest bump that the pinned action does not know yet needs an action
      # bump too.
      - name: Read nextest version
        id: nextest
        run: |
          version="$(sed -nE 's/^nextest-version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' .config/nextest.toml)"
          [[ -n "$version" ]] || { echo "nextest-version missing from .config/nextest.toml" >&2; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Install nextest
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: nextest@${{ steps.nextest.outputs.version }}
          fallback: none

      # The setup script validates the restored fork's source tree, so a cache
      # entry can never stand in for a different patch series. The key has no
      # fallback prefix for the same reason.
      - name: Restore GPUI fork checkout
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.workspace }}/zed-gpui-fork
          key: gpui-fork-${{ hashFiles('Cargo.toml', 'scripts/gpui-fork-patches.txt', 'patches/**') }}

      - name: Reconstruct pinned GPUI fork
        run: ./scripts/setup-gpui-fork.sh

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check canonical formatting
        run: cargo fmt --all -- --check

      - name: Run Linux pull-request suite
        run: ./scripts/test-linux.sh quick-nextest

      - name: Run Clippy
        run: make lint

      - name: Verify Linux build and artifacts
        run: ./scripts/verify-linux-build.sh

      - name: Run real GPUI startup smoke under Xvfb
        run: |
          # verify-linux-build.sh above produced and checked this binary.
          [[ -x target/dist/echo ]] || { echo "target/dist/echo is missing; the verify step must run first" >&2; exit 1; }
          cargo build --release --locked -p profile-log-check
          smoke_root="${RUNNER_TEMP}/echo-linux-smoke"
          ECHO_BENCH_PROFILE_ROOT="${smoke_root}/profile" \
            xvfb-run --auto-servernum python3 scripts/bench/run-echo-profile.py \
              --output-root "${smoke_root}/artifacts" \
              --scenario "Linux CI dist startup smoke" \
              --launch-path target/dist/echo \
              --duration-seconds 8 \
              --exit-wait-seconds 5 \
              --stop-mode close-main-window \
              --profile-log-check-path target/release/profile-log-check \
              --echo-build-type dist \
              --cache-state isolated \
              --fixture-name linux-ci-startup

      - name: Upload test and smoke reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: echo-linux-test-reports-${{ github.sha }}
          path: |
            target/nextest/ci/junit.xml
            target/linux-tool-checks
            target/linux-test-stages
            ${{ runner.temp }}/echo-linux-smoke/artifacts
            ${{ runner.temp }}/echo-linux-smoke/profile/logs/echo.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Linux binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: echo-linux-x64-${{ github.sha }}
          path: |
            target/dist/echo
            target/dist/echo-version
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      # The tarball a GitHub release attaches for Linux. This job only builds
      # it; creating a release is a separate, manual step.
      - name: Package Linux release tarball
        run: ./scripts/package-linux-release.sh

      - name: Upload Linux release tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: echo-linux-release-${{ github.sha }}
          path: target/dist/package/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
