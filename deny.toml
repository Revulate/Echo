[graph]
# Echo ships for Windows and Linux. The macOS targets keep GPUI's macOS-only
# dependency edges in the checked graph, so their advisories and licenses stay
# visible.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
maximum-db-staleness = "P30D"
# An exception whose advisory no longer matches the graph is reported, so it
# can be removed as DEPENDENCY_POLICY.md requires.
unused-ignored-advisory = "warn"
ignore = [
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is transitive through Zed's reqwest client and has no safe upgrade. Remove when Zed's reqwest client no longer depends on it." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is transitive through GPUI fontdb/usvg/rustybuzz and has no safe upgrade. Remove when the upstream rendering stack migrates to skrifa." },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is transitive through GPUI's pinned usvg/resvg SVG stack and has no safe upgrade. Remove when GPUI adopts an SVG stack that no longer depends on rustybuzz, after validating SVG emotes and image name paints." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5 is transitive through zbus 5, which GPUI's accesskit/atspi/oo7 Linux stack and notify-rust still use; zbus 6 absorbed it. Remove when those move to zbus 6 and Echo's Linux KWin client follows." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 is transitive through zbus 5; same zbus 6 migration as RUSTSEC-2026-0370." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 is transitive through zbus 5; same zbus 6 migration as RUSTSEC-2026-0370." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# Cargo Deny diagnoses path-patched GPUI workspace dependencies and immutable
# Git revisions as wildcards. Source restrictions and Cargo.lock enforce the
# reproducibility boundary while those Cargo metadata edges remain unresolved.
wildcards = "allow"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/gfx-rs/wgpu",
    "https://github.com/Smithay/wayland-rs",
    "https://github.com/proptest-rs/proptest",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/oo7",
    "https://github.com/zed-industries/reqwest.git",
    "https://github.com/zed-industries/xim-rs.git",
]
