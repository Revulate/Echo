[package]
name = "echo-chat-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GPUI-dependent chat render model and interaction policies for Echo"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
dashmap.workspace = true
echo-core.workspace = true
echo-cosmetics-core.workspace = true
echo-render-core.workspace = true
gpui.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true
tracing.workspace = true

# The `echo_core::log_*!` macros expand to `tracing::...` at the call site, so
# this crate needs `tracing` as a direct dependency without naming it itself.
[package.metadata.cargo-machete]
ignored = ["tracing"]
