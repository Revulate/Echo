[package]
name = "echo-media-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Persistent media cache and GPUI RenderImage decoding for Echo"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ahash.workspace = true
# Read-only compatibility for existing Bincode 2 cache files. Current writes
# use Postcard exclusively.
bincode.workspace = true
blake3 = "1.5"
dashmap.workspace = true
echo-core.workspace = true
echo-cache-policy.workspace = true
echo-render-core.workspace = true
gpui.workspace = true
image = { workspace = true, features = ["png", "gif", "jpeg", "webp"] }
parking_lot.workspace = true
postcard.workspace = true
serde = { workspace = true, features = ["rc"] }
smallvec.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "sync"] }
tracing.workspace = true
zstd.workspace = true

[dev-dependencies]
echo-cache-policy = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
