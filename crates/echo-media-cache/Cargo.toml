[package]
name = "echo-media-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Persistent media cache and GPUI RenderImage decoding for Echo"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ahash = "0.8"
# Read-only compatibility for existing Bincode 2 cache files. Current writes
# use Postcard exclusively.
bincode = { package = "cu-bincode", version = "2.0.2", features = ["serde"] }
blake3 = "1.5"
dashmap = "6"
echo-core = { path = "../echo-core" }
echo-cache-policy = { path = "../echo-cache-policy" }
echo-render-core = { path = "../echo-render-core" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "9a8ab54db4f9f9af4dc6efb42b304c55c6a62bd3" }
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "webp"] }
parking_lot = "0.12"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0", features = ["derive", "rc"] }
smallvec = "1"
tokio = { version = "1", features = ["fs", "rt", "sync"] }
tracing = "0.1"
zstd = "0.14"

[dev-dependencies]
echo-cache-policy = { path = "../echo-cache-policy", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
