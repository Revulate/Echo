[package]
name = "echo-cache-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GPUI-free cache budget, eviction, statistics, and preload policy for Echo"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ahash = "0.8"
dashmap = "6"
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive", "rc"] }
sysinfo.workspace = true

[dev-dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }

[features]
# Exposes test-only fixture constructors to dependent crates' dev-dependencies.
test-support = []
