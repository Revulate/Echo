[package]
name = "echo-cache-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GPUI-free cache budget, eviction, statistics, and preload policy for Echo"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
ahash.workspace = true
dashmap.workspace = true
echo-core.workspace = true
indexmap = { version = "2", features = ["serde"] }
parking_lot.workspace = true
serde = { workspace = true, features = ["rc"] }
sysinfo.workspace = true

[dev-dependencies]
postcard.workspace = true

[features]
# Exposes test-only fixture constructors to dependent crates' dev-dependencies.
test-support = []
