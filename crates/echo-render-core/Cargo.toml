[package]
name = "echo-render-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "GPUI-free rendering data structures for Echo"
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
echo-core.workspace = true
lru.workspace = true
smallvec.workspace = true
tracing.workspace = true
unicode-bidi = "0.3"

# The `echo_core::log_*!` macros expand to `tracing::...` at the call site, so
# this crate needs `tracing` as a direct dependency without naming it itself.
[package.metadata.cargo-machete]
ignored = ["tracing"]
